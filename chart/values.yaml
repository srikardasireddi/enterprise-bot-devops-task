replicaCount: 2

image:
  repository: demo-service
  tag: local
  pullPolicy: IfNotPresent

service:
  port: 80
  targetPort: 8080

config:
  appName: demo-service
  version: 0.1.0

ingress:
  enabled: true
  className: nginx
  host: demo.local
  path: /
  pathType: Prefix

resources:
  requests:
    cpu: 50m
    memory: 64Mi
  limits:
    cpu: 200m
    memory: 128Mi
